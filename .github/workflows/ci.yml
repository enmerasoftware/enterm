name: Tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Core tests
        run: swift test --filter EntermCoreTests
      - name: Relay tests
        run: node --test relay/server.test.mjs
