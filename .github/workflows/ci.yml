name: Tests

on:
  push:
    branches: [main]
    paths-ignore: ["library/**", "site/**", ".github/workflows/library.yml"]
  pull_request:
    paths-ignore: ["library/**", "site/**", ".github/workflows/library.yml"]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Core tests
        run: swift test --filter EntermCoreTests
      - name: Relay tests
        run: node --test relay/server.test.mjs
      - name: English for every on-screen string
        run: python3 scripts/strings.py --check
