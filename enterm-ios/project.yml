name: EntermPhone
options:
  bundleIdPrefix: tr.com.enmera
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  SwiftTerm:
    path: ../.build/checkouts/SwiftTerm
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.5"
    # iPhone only for now: an iPad build must allow every orientation and bring its own screenshots.
    TARGETED_DEVICE_FAMILY: "1"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: 79N3CT6T46
    CODE_SIGN_STYLE: Automatic
targets:
  EntermCore:
    type: framework
    platform: iOS
    sources:
      - path: ../Sources/EntermCore
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_BUNDLE_IDENTIFIER: tr.com.enmera.enterm.core
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES
  Enterm:
    type: application
    platform: iOS
    sources:
      - path: Enterm
      - path: Shared
    dependencies:
      - target: EntermCore
      - target: EntermNotify
      - target: EntermWidgets
      - package: SwiftTerm
    postCompileScripts:
      - name: Languages
        # English comes from the same table as the Mac's (Resources/en.json); a tr.lproj folder says Turkish is spoken too.
        script: |
          dest="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
          mkdir -p "$dest/en.lproj" "$dest/tr.lproj"
          plutil -convert binary1 -o "$dest/en.lproj/Localizable.strings" "$SRCROOT/../Resources/en.json"
          cp "$SRCROOT/../Resources/ios/tr.lproj/InfoPlist.strings" "$dest/tr.lproj/InfoPlist.strings"
          cp "$SRCROOT/../Resources/tr.lproj/Localizable.strings" "$dest/tr.lproj/Localizable.strings"
        inputFiles:
          - $(SRCROOT)/../Resources/en.json
          - $(SRCROOT)/../Resources/ios/tr.lproj/InfoPlist.strings
          - $(SRCROOT)/../Resources/tr.lproj/Localizable.strings
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/en.lproj/Localizable.strings
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/tr.lproj/InfoPlist.strings
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/tr.lproj/Localizable.strings
    entitlements:
      path: Enterm/Enterm.entitlements
      properties:
        aps-environment: development
        keychain-access-groups:
          - $(AppIdentifierPrefix)tr.com.enmera.enterm.shared
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_BUNDLE_IDENTIFIER: tr.com.enmera.enterm.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Enterm
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        # Only Apple's own encryption (CryptoKit): App Store Connect stops asking at every build.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_NSCameraUsageDescription: To scan the code shown on your computer.
        INFOPLIST_KEY_NSFaceIDUsageDescription: To confirm it's you before allowing an action.
        # The languages live in en.lproj and tr.lproj, written by the Languages step.
        DEVELOPMENT_LANGUAGE: en
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
    info:
      path: Enterm/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: tr.com.enmera.enterm.pair
            CFBundleURLSchemes: [enterm]
        UIBackgroundModes: [remote-notification]
        NSSupportsLiveActivities: true
  EntermWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: EntermWidgets
      - path: Shared
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    postCompileScripts:
      - name: Languages
        # English comes from the same table as the Mac's (Resources/en.json); a tr.lproj folder says Turkish is spoken too.
        script: |
          dest="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
          mkdir -p "$dest/en.lproj" "$dest/tr.lproj"
          plutil -convert binary1 -o "$dest/en.lproj/Localizable.strings" "$SRCROOT/../Resources/en.json"
          cp "$SRCROOT/../Resources/ios/tr.lproj/InfoPlist.strings" "$dest/tr.lproj/InfoPlist.strings"
          cp "$SRCROOT/../Resources/tr.lproj/Localizable.strings" "$dest/tr.lproj/Localizable.strings"
        inputFiles:
          - $(SRCROOT)/../Resources/en.json
          - $(SRCROOT)/../Resources/ios/tr.lproj/InfoPlist.strings
          - $(SRCROOT)/../Resources/tr.lproj/Localizable.strings
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/en.lproj/Localizable.strings
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/tr.lproj/InfoPlist.strings
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/tr.lproj/Localizable.strings
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_BUNDLE_IDENTIFIER: tr.com.enmera.enterm.ios.widgets
        GENERATE_INFOPLIST_FILE: YES
        DEVELOPMENT_LANGUAGE: en
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    info:
      path: EntermWidgets/Info.plist
      properties:
        CFBundleDisplayName: Enterm
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  EntermNotify:
    type: app-extension
    platform: iOS
    sources:
      - path: EntermNotify
    dependencies:
      - target: EntermCore
    postCompileScripts:
      - name: Languages
        # English comes from the same table as the Mac's (Resources/en.json); a tr.lproj folder says Turkish is spoken too.
        script: |
          dest="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
          mkdir -p "$dest/en.lproj" "$dest/tr.lproj"
          plutil -convert binary1 -o "$dest/en.lproj/Localizable.strings" "$SRCROOT/../Resources/en.json"
          cp "$SRCROOT/../Resources/ios/tr.lproj/InfoPlist.strings" "$dest/tr.lproj/InfoPlist.strings"
          cp "$SRCROOT/../Resources/tr.lproj/Localizable.strings" "$dest/tr.lproj/Localizable.strings"
        inputFiles:
          - $(SRCROOT)/../Resources/en.json
          - $(SRCROOT)/../Resources/ios/tr.lproj/InfoPlist.strings
          - $(SRCROOT)/../Resources/tr.lproj/Localizable.strings
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/en.lproj/Localizable.strings
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/tr.lproj/InfoPlist.strings
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/tr.lproj/Localizable.strings
    entitlements:
      path: EntermNotify/EntermNotify.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)tr.com.enmera.enterm.shared
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_BUNDLE_IDENTIFIER: tr.com.enmera.enterm.ios.notify
        GENERATE_INFOPLIST_FILE: YES
        DEVELOPMENT_LANGUAGE: en
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    info:
      path: EntermNotify/Info.plist
      properties:
        CFBundleDisplayName: EntermNotify
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
